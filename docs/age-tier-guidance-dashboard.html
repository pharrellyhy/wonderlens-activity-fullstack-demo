  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0a0e17;
      color: #e2e8f0;
      font-family: 'Noto Sans SC', 'Outfit', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes glowPulse {

      0%,
      100% {
        filter: drop-shadow(0 0 4px currentColor);
      }

      50% {
        filter: drop-shadow(0 0 10px currentColor);
      }
    }

    .fade-section {
      animation: fadeUp 0.6s ease both;
    }

    .fade-section:nth-child(2) {
      animation-delay: 0.08s;
    }

    .fade-section:nth-child(3) {
      animation-delay: 0.16s;
    }

    .fade-section:nth-child(4) {
      animation-delay: 0.24s;
    }

    .fade-section:nth-child(5) {
      animation-delay: 0.32s;
    }

    .fade-section:nth-child(6) {
      animation-delay: 0.40s;
    }

    .fade-section:nth-child(7) {
      animation-delay: 0.48s;
    }

    .fade-section:nth-child(8) {
      animation-delay: 0.56s;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #0a0e17;
    }

    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
  </style>
</head>

                    fontSize: '11px', fontWeight: 600, color: box.color,
                    lineHeight: 1.3,
                  }}>
                    {box.label}
                  </span>
                  <span style={{fontSize: '10px', color: C.textDim, lineHeight: 1.3}}>
                    {box.labelCn}
                  </span>
                </div>
                {i < boxes.length - 1 && (
                  <div style={{color: C.textDim, fontSize: '16px', flexShrink: 0, padding: '0 2px'}}>&#10132;</div>
                )}
              </React.Fragment>
            ))}
          </div>
          <div style={{
            marginTop: '16px', paddingTop: '12px', borderTop: `1px solid ${C.border}`,
            display: 'flex', gap: '20px', justifyContent: 'center', flexWrap: 'wrap',
          }}>
            <div style={{display: 'flex', alignItems: 'center', gap: '6px', fontSize: '11px', color: C.textDim}}>
              <span style={{fontSize: '14px'}}>&#9881;</span> 离线预处理步骤

            <div style={{display: 'flex', alignItems: 'center', gap: '6px', fontSize: '11px', color: C.textDim}}>
              <span style={{fontSize: '14px'}}>&#128193;</span> 数据存储
            </div>
            <div style={{display: 'flex', alignItems: 'center', gap: '6px', fontSize: '11px', color: C.textDim}}>
              <span style={{fontSize: '14px'}}>&#9889;</span> 实时运行服务
            </div>
          </div>
        </div>
      );
    }

    /* ── Usage Guide ──────────────────────────────────────────── */

    function UsageGuide() {
      const [open, setOpen] = useState(true);
      const items = [
        {
          icon: '&#128218;', title: '这份文档是什么',
          text: '这是 WonderLens 年龄分层引导系统的可视化参考手册，完整呈现 4 个认知层级的所有行为参数和 IB 概念配置。'
        },
        {
          icon: '&#127922;', title: '两层引导架构',
          text: '系统分为两层：① 全局分层配置 — 控制对话行为、语音参数、IB 概念（Section 01–03 展示）；② 每实体话题引导 — 预计算的实体级主题锚点，告诉 AI 针对具体事物聊什么（Section 04 以苹果为例展示）。'
        },
        {
          icon: '&#128269;', title: '如何阅读',
          text: '点击 Section 01 的分层卡片可展开查看全部 20 个属性。Section 02 矩阵展示 IB 概念在哪个层级首次解锁。Section 03 提供跨层级的特征对比。Section 06 术语表解释所有专业术语的含义和设计意图。'
        },
        {
          icon: '&#127891;', title: '设计原则',
          text: '从温暖简单（Tier 0 呼唤-回应）到理性抽象（Tier 3 同伴对话），每个层级的参数都围绕该年龄段的认知发展特征精心设计，同时对齐 IB PYP 探究框架的 7 个核心概念。'
        },
      ];

      return (
        <div style={{
          background: `linear-gradient(135deg, ${TIER_COLORS[1].glow}, ${TIER_COLORS[2].glow})`,
          border: `1px solid ${TIER_COLORS[1].main}25`,
          borderRadius: '10px', overflow: 'hidden',
        }}>
          <div
            onClick={() => setOpen(!open)}
            style={{
              padding: '14px 20px', cursor: 'pointer',
              display: 'flex', justifyContent: 'space-between', alignItems: 'center',
            }}
          >
            <div style={{
              fontFamily: display, fontSize: '14px', fontWeight: 700, color: TIER_COLORS[1].light,
              display: 'flex', alignItems: 'center', gap: '8px',
            }}>
              <span style={{fontSize: '16px'}}>&#128161;</span>
              使用说明 How to Use This Dashboard
            </div>
            <div style={{
              fontSize: '14px', color: C.textDim, transition: 'transform 0.2s',
              transform: open ? 'rotate(180deg)' : 'rotate(0deg)', userSelect: 'none',
            }}>&#9662;</div>
          </div>
          {open && (
            <div style={{
              padding: '0 20px 16px',
              display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px',
            }}>
              {items.map((item, i) => (
                <div key={i} style={{
                  padding: '12px', background: `${C.bg}cc`, borderRadius: '8px',
                  border: `1px solid ${C.border}`,
                }}>
                  <div style={{
                    fontFamily: display, fontSize: '12px', fontWeight: 700, color: C.text,
                    marginBottom: '4px', display: 'flex', alignItems: 'center', gap: '6px',
                  }}>
                    <span dangerouslySetInnerHTML={{__html: item.icon}} />
                    {item.title}
                  </div>
                  <div style={{fontSize: '12px', color: C.textMuted, lineHeight: 1.7}}>
                    {item.text}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    /* ── Glossary ─────────────────────────────────────────────── */

    function GlossarySection() {
      const [openKey, setOpenKey] = useState(null);

      return (
        <div style={{display: 'flex', flexDirection: 'column', gap: '8px'}}>
          {GLOSSARY.map(group => {
            const isOpen = openKey === group.key;
            return (
              <div key={group.key} style={{
                background: C.surface, border: `1px solid ${isOpen ? C.borderAccent : C.border}`,
                borderRadius: '8px', overflow: 'hidden', transition: 'border-color 0.2s',
              }}>
                <div
                  onClick={() => setOpenKey(isOpen ? null : group.key)}
                  style={{
                    padding: '12px 16px', cursor: 'pointer',
                    display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                  }}
                  onMouseEnter={e => {e.currentTarget.style.background = C.surfaceHover;}}
                  onMouseLeave={e => {e.currentTarget.style.background = 'transparent';}}
                >
                  <div>
                    <span style={{fontSize: '14px', fontWeight: 600, color: C.text}}>{group.cn}</span>
                    <div style={{fontSize: '12px', color: C.textDim, marginTop: '2px'}}>{group.desc}</div>
                  </div>
                  <div style={{
                    fontSize: '14px', color: C.textDim, transition: 'transform 0.2s',
                    transform: isOpen ? 'rotate(180deg)' : 'rotate(0deg)', userSelect: 'none',
                    flexShrink: 0, marginLeft: '12px',
                  }}>&#9662;</div>
                </div>

                {isOpen && (
                  <div style={{padding: '0 16px 14px'}}>
                    <div style={{
                      display: 'flex', flexDirection: 'column', gap: '4px',
                    }}>
                      {group.terms.map((t, i) => (
                        <div key={i} style={{
                          display: 'grid', gridTemplateColumns: '120px auto',
                          gap: '12px', padding: '8px 12px', background: C.bg,
                          borderRadius: '6px', border: `1px solid ${C.border}`,
                          alignItems: 'baseline',
                        }}>
                          <div style={{fontSize: '13px', fontWeight: 600, color: C.text}}>
                            {t.cn}
                          </div>
                          <div style={{fontSize: '12px', color: C.textMuted, lineHeight: 1.6}}>
                            {t.desc}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      );
    }

    /* ── App ──────────────────────────────────────────────────── */

    function App() {
      return (
        <div style={{minHeight: '100vh', background: C.bg, fontFamily: body}}>
          <Header />
          <div style={{maxWidth: '1300px', margin: '0 auto', padding: '32px 24px 60px'}}>
            <div className="fade-section" style={{marginBottom: '32px'}}>
              <UsageGuide />
            </div>

            <div className="fade-section" style={{marginBottom: '40px'}}>
              <SectionHeader number="01" titleCn="分层总览" titleEn="Tier Overview" />
              <TierCards />
            </div>

            <div className="fade-section" style={{marginBottom: '40px'}}>
              <SectionHeader number="02" titleCn="IB 概念解锁矩阵" titleEn="Key Concepts Unlock Matrix" />
              <ConceptMatrix />
            </div>

            <div className="fade-section" style={{marginBottom: '40px'}}>
              <SectionHeader number="03" titleCn="层级特征对比" titleEn="Tier Feature Comparison" />
              <ComparisonTable />
            </div>

            <div className="fade-section" style={{marginBottom: '40px'}}>
              <SectionHeader number="04" titleCn="实体示例" titleEn="Per-Entity Examples" />
              <EntityExamples />
            </div>

            <div className="fade-section" style={{marginBottom: '40px'}}>
              <SectionHeader number="05" titleCn="数据处理流程" titleEn="Processing Flow" />
              <PipelineFlow />
            </div>

            <div className="fade-section" style={{marginBottom: '40px'}}>
              <SectionHeader number="06" titleCn="术语表" titleEn="Glossary" />

            {/* footer */}
            <div className="fade-section" style={{
              marginTop: '24px', padding: '14px', background: C.surface, borderRadius: '8px',
              border: `1px solid ${C.border}`,
            }}>
              <div style={{fontSize: '11px', color: C.textDim, lineHeight: 1.7}}>
                <strong style={{color: C.textMuted}}>说明：</strong>
                本文档数据来自 WonderLens 年龄分层引导系统配置，包含全部 4 个认知层级的行为参数、IB 概念解锁规则和探索话题标签。
                多个实体示例展示了实体级话题引导的分层设计思路。
              </div>

          </div>
        </div>

    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
