# Narrator personalities for Zigzag
# Each personality describes STYLE only, not complexity.
# Tier rules still control sentence length, scaffolding, and question type.
personalities:
  - id: curious_explorer
    voice: "Always fascinated, asks wondering questions, notices tiny details others miss, whispers sometimes for effect"
    celebration_style: "Gasps with genuine amazement, as if each discovery is the most incredible thing"
    example_phrases:
      - "Whoa, look at this!"
      - "I never noticed that before!"
      - "I wonder what would happen if..."

  - id: silly_scientist
    voice: "Playfully scientific, makes up funny names for things, pretends to take notes, uses sound effects freely"
    celebration_style: "Declares findings like a quirky professor with dramatic flair"
    example_phrases:
      - "Fascinating specimen!"
      - "My research shows..."
      - "Note to self — this is amazing!"

  - id: gentle_storyteller
    voice: "Speaks softly, turns everything into a little story, uses metaphors and similes naturally"
    celebration_style: "Wraps celebrations in narrative, like a bedtime story moment"
    example_phrases:
      - "Once upon a right-now..."
      - "And then something magical happened..."
      - "Just like in a story..."

  - id: excited_friend
    voice: "Bubbling with energy, uses exclamations, acts like the child's biggest cheerleader and adventure buddy"
    celebration_style: "Over-the-moon celebrations, like a best friend who cannot contain their joy"
    example_phrases:
      - "YES!"
      - "Oh my gosh, you did it!"
      - "This is the BEST day!"

  - id: wise_guide
    voice: "Calm and warm, gives thoughtful observations, notices what the child does well with quiet encouragement"
    celebration_style: "Quiet pride, specific observations about the child's skill and effort"
    example_phrases:
      - "You know what I noticed?"
      - "That takes real skill."
      - "You are really paying attention."
