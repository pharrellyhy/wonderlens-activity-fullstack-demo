# Veo 3.1 prompt templates for character animation clips.
# Each character has a base visual description + per-state action prompts.
# Resolution: 480x480, Format: MP4 (H.264)

defaults:
  resolution: "480x480"
  style: >
    3D rendered toy aesthetic, Pixar-inspired, warm lighting. No text or UI elements.
    IMPORTANT: The character must be centered in the frame, medium close-up shot,
    facing slightly toward camera. Same size, position, and camera angle in every clip.
    CRITICAL TIMING RULE: The first 2 seconds the character sits COMPLETELY STILL in its
    resting pose — no movement at all. Then the action happens for 4 seconds. Then the
    last 2 seconds the character MUST return to and hold the EXACT same still resting pose
    as the opening frame — same position, same posture, same expression, completely
    motionless. The first and last frames must be visually identical. This is essential
    for seamless looping. No camera pans or zoom changes throughout the clip.
  loop_duration: "4s"
  oneshot_duration: "3s"

characters:
  mood_changer_dog:
    prefix: dog
    base: >
      A cute, friendly stuffed dog toy with soft blue fur, floppy ears, and a round nose.
      Centered in frame, sitting upright, facing slightly toward camera.
      In a cozy, bright children's bedroom with soft pastel walls, plush rugs, and toys on shelves.
    states:
      idle:
        type: loop
        action: >
          The dog breathes gently, with a slight rhythmic chest rise and fall.
          Ears occasionally twitch softly. Calm and content expression.
      listening:
        type: loop
        action: >
          The dog leans forward attentively, both ears perked up high, head tilted
          slightly to one side. Eyes wide and focused as if carefully listening to something.
      thinking:
        type: loop
        action: >
          The plush toy slowly tilts to one side, then the other, with a puzzled
          but adorable expression. Ears gently swaying with each tilt.
      speaking:
        type: loop
        action: >
          The stuffed dog toy nods its head rhythmically, body swaying gently
          side to side with warm energy. Ears flopping, tail wagging softly.
      excited:
        type: oneshot
        action: >
          The dog bounces up and down happily, tail wagging rapidly, ears flopping
          with joy. A big open-mouth smile. Pure delight and celebration.
      encouraging:
        type: oneshot
        action: >
          The dog gives a warm, gentle nod. Soft kind eyes, mouth in a reassuring
          half-smile. One paw reaches forward slightly as if to comfort.
      surprised:
        type: oneshot
        action: >
          The stuffed dog toy suddenly perks up with wide eyes, ears shooting
          straight up, body leaning back slightly in delighted amazement.
      waving:
        type: oneshot
        action: >
          The dog raises one paw and waves hello/goodbye with a friendly smile.
          Gentle side-to-side paw motion. Warm, welcoming expression.
      celebrating:
        type: loop
        action: >
          The plush toy dances happily, rocking side to side with a big smile,
          ears bouncing with each movement. Radiating warmth and pride.

  dream_whisperer_cat:
    prefix: cat
    base: >
      A chubby, round stuffed orange tabby cat toy with dark stripes, half-lidded lazy eyes,
      a smug little grin, and a big round belly. Centered in frame, sitting lazily,
      facing slightly toward camera.
      In a warm, cozy nursery with a cushioned window seat, fairy lights, and soft blankets.
    states:
      idle:
        type: loop
        action: >
          The cat breathes softly, tail slowly curling and uncurling. Occasional slow
          blink with a serene expression. Whiskers gently twitching.
      listening:
        type: loop
        action: >
          The cat's ears rotate forward, body leaning in slightly. Eyes wide and
          attentive, whiskers pointing forward. Alert but calm.
      thinking:
        type: loop
        action: >
          The cat tilts its head thoughtfully, one paw tucked under its chin.
          Eyes half-closed in a contemplative expression. Tail tip twitching slowly.
      speaking:
        type: loop
        action: >
          The cat nods and sways gently with expressive body language, head
          bobbing softly, tail swishing. Engaged and animated energy.
      excited:
        type: oneshot
        action: >
          The cat springs up with delight, paws in the air, tail puffed with joy.
          Eyes sparkling, mouth in a wide happy grin. Prancing motion.
      encouraging:
        type: oneshot
        action: >
          The cat gives a slow, warm blink (cat kiss) and a gentle head nod.
          Soft purring posture, body relaxed and welcoming. Reassuring.
      surprised:
        type: oneshot
        action: >
          The cat's eyes go perfectly round, ears flatten slightly then pop up,
          body arches in surprise. Whiskers spread wide. Amazed expression.
      waving:
        type: oneshot
        action: >
          The cat raises one paw gracefully and waves with a gentle, dreamy smile.
          Slow, elegant wave motion. Tail curls in greeting.
      celebrating:
        type: loop
        action: >
          The cat prances proudly in place, tail held high, eyes sparkling
          with satisfaction. Graceful, celebratory body language.

  time_machine_dinosaur:
    prefix: dinosaur
    base: >
      A cute, friendly stuffed dinosaur toy (brontosaurus-style) with soft amber/golden fur,
      a long neck, big round eyes, and a gentle smile. Centered in frame, standing upright on
      all four legs, facing slightly toward camera. The character must stay in the same spot —
      no walking, no drifting, no repositioning.
      In a colorful children's playroom with wooden toy blocks, picture books, and a small tent.
    states:
      idle:
        type: loop
        action: >
          The dinosaur sways gently, long neck moving in a slow figure-eight.
          Tail swishes lazily side to side. Peaceful, contented expression.
      listening:
        type: loop
        action: >
          The dinosaur stretches its long neck forward and downward, head turned
          to listen. Eyes focused, body still with attention. Ears (small bumps) perked.
      thinking:
        type: loop
        action: >
          The plush dinosaur toy slowly tilts its long neck to one side, then
          the other, with a puzzled but adorable expression. Gentle swaying.
      speaking:
        type: loop
        action: >
          The dinosaur bobs its long neck rhythmically, body rocking gently
          with enthusiasm. Tail swinging, eyes bright and engaged.
      excited:
        type: oneshot
        action: >
          The dinosaur stomps its feet happily, neck swinging side to side with joy.
          Big toothy grin, tail sweeping in celebration. Earthquake of happiness.
      encouraging:
        type: oneshot
        action: >
          The dinosaur lowers its long neck to eye level and gives a gentle,
          warm nod. Soft eyes, reassuring expression. A comforting giant.
      surprised:
        type: oneshot
        action: >
          The plush toy gently tilts its head with big curious round eyes, neck
          swaying slowly with delight, discovering something wonderful nearby.
      waving:
        type: oneshot
        action: >
          The stuffed dinosaur toy gently raises one front paw and sways it in a
          friendly hello gesture. Long neck bobbing happily, warm cheerful smile.
      celebrating:
        type: loop
        action: >
          The stuffed dinosaur toy stomps its feet triumphantly, long neck
          swinging with pride. Big toothy grin, tail sweeping in celebration.

# Scenario illustration clips — pre-generated from fixed round_scenarios.
# These loop as the "world" for each round in the device panel.
scenarios:
  mood_changer_dog:
    style: >
      Warm, child-friendly scene. Soft lighting.
    clips:
      warm_sunshine: "Basking in warm sunshine, lying on its belly with a content expression, golden light beams across soft grass."
      tripped_bump: "Just tripped and went bump, sitting with a surprised expression, looking up with big eyes."
      favorite_treat: "Seeing its favorite treat arriving on a plate, eyes wide with excitement, tail wagging."
      butterfly: "Watching a colorful butterfly flying by, head following it with wonder, butterfly leaving a sparkle trail."
      thunder: "Hearing thunder outside, ears flat, looking at a rain-streaked window with a nervous but brave expression."
      best_friend: "Its best friend (another stuffed toy) coming to visit, both toys face to face with happy expressions."
      bath_time: "In a bath with bubbles floating around, looking surprised but playful, rubber duck nearby."
      muddy_puddle: "Standing at the edge of a muddy puddle, paws getting splashed, looking delighted and messy."

  dream_whisperer_cat:
    style: >
      Dreamy, ethereal scene with soft violet tones. Whimsical atmosphere.
    clips:
      floating_cloud: "Floating peacefully on a fluffy white cloud in a pastel sky, paws dangling, serene expression."
      milk_ocean: "Swimming playfully in a gentle ocean of milk, small waves lapping, whiskers wet, dreamy atmosphere."
      magical_garden: "Exploring a magical garden filled with glowing flowers, yarn balls, and fish-shaped leaves."
      glowing_star: "Chasing a softly glowing star through a dark but friendly night, star leaving a golden trail."
      giant_bird: "Riding on the back of a giant friendly bird soaring through cotton-candy clouds."
      yarn_castle: "Inside a whimsical castle made entirely of colorful yarn balls, batting at dangling strings."
      rainbow_bridge: "Bouncing along a vibrant rainbow bridge arcing across a starry sky, each bounce leaving sparkles."
      pillow_cave: "Curled up in a cozy cave made of soft pillows and blankets, warm glow, completely content."

  time_machine_dinosaur:
    style: >
      Epic but child-friendly prehistoric scene. Warm amber tones. The background
      environment must be alive and animated throughout — water rippling, lava
      flowing, leaves rustling, snow drifting, clouds moving. The world is dynamic
      and immersive. Only the CHARACTER follows the resting pose timing rule.
    clips:
      prehistoric_jungle: "Standing in a lush prehistoric jungle with giant ferns swaying in the breeze, palm trees rustling, insects flying, sunlight beams shifting through the moving canopy. The dinosaur looks around curiously for a few seconds, then slowly returns to standing perfectly still facing the camera with a calm neutral expression."
      rumbling_volcano: "Near a rumbling volcano with glowing orange lava actively flowing down the sides, smoke billowing, ash drifting in the air, dramatic fiery sky with shifting clouds. Looking up in awe."
      lake_sunset: "By a calm lake at sunset with water gently rippling and shimmering with golden reflections, fireflies appearing, clouds drifting across the warm orange-pink sky. Serene mood."
      snowy_mountain: "On a snowy mountain top with snowflakes actively falling and swirling in the wind, breath visible as puffs, clouds rolling past the peaks below. Amazed by the view."
      spooky_cave: "Near a dark spooky cave with eerie glowing light pulsing from deep inside, mist creeping along the ground, shadows flickering on the rocky walls. The dinosaur peeks curiously for a few seconds, then slowly returns to standing perfectly still facing the camera with a calm neutral expression."
      giant_flowers: "Walking through a field of giant colorful flowers, each flower taller than the dinosaur, magical atmosphere."
      stormy_beach: "On a stormy ocean beach, waves crashing, wind blowing, looking brave and adventurous."
      friendly_dinosaur: "Meeting another friendly dinosaur face to face, both smiling, touching noses, warm friendship moment."
