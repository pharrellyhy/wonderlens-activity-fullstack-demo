step_group: cat5_celebrate_closing
examples:
  # ══════════════════════════════════════════════════════════════════
  #  CELEBRATE
  # ══════════════════════════════════════════════════════════════════

  - tier: T0
    scenario: ideal
    style: default
    text: |
      **Celebrate — Personal recall:**
      AI: "[proud] You poked that first one and said 'squishy' — that was the best! You're an amazing {role_title}!"

  - tier: T0
    scenario: ideal
    style: default
    text: |
      **Celebrate — Name-focused recall:**
      AI: "[proud] Silky was my favorite name — you picked it all by yourself! What a great {role_title} you are!"

  - tier: T1
    scenario: ideal
    style: default
    text: |
      **Celebrate — Highlight comparison:**
      AI: "[proud] You noticed every texture was different — fuzzy, silky, curly! That takes real explorer instincts. Incredible work, {role_title}!"

  - tier: T1
    scenario: ideal
    style: default
    text: |
      **Celebrate — Story moment recall:**
      AI: "[proud] When you said Satin Breeze was smoother than Pillow Puff — that was such a sharp observation! Well done, {role_title}!"

  - tier: T2
    scenario: ideal
    style: default
    text: |
      **Celebrate — Growth reflection:**
      AI: "[proud] You started with one small discovery and built a whole world of characters and stories from it. That's the mark of a true {role_title}!"

  - tier: T2
    scenario: ideal
    style: default
    text: |
      **Celebrate — Creative highlight:**
      AI: "[proud] The name Rumble for something soft on the inside — that showed real creativity. You see things other people miss, {role_title}!"

